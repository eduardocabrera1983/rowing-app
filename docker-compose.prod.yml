services:
  rowing-app:
    build: .
    container_name: concept2-rowing-app
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/workouts.db
      - APP_PORT=8000
      - APP_DEBUG=false
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - rowing-app
    restart: unless-stopped
    networks:
      - app-net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - ./scripts/certbot-deploy-hook.sh:/etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh:ro
      # Mount docker socket so the deploy hook can reload nginx after a renewal.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    # Use the image's default entrypoint (`certbot`) and put the renewal loop in `command:`.
    # This way `docker compose run --rm certbot <args>` works as expected (args are passed to certbot).
    # The previous `entrypoint: while :; do certbot renew; sleep 12h; done` swallowed all run args
    # and left zombie containers holding the certbot lock. Webroot is forced so renewals don't
    # try to bind port 80 (which is taken by nginx).
    entrypoint: ""
    command:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        # Install docker CLI once so the deploy hook can talk to nginx.
        apk add --no-cache docker-cli >/dev/null 2>&1 || true
        while :; do
          certbot renew \
            --webroot -w /var/www/certbot \
            --non-interactive \
            --deploy-hook "/etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh"
          sleep 12h & wait $${!}
        done
    networks:
      - app-net

volumes:
  app-data:
  certbot-etc:
  certbot-var:
  certbot-www:

networks:
  app-net:
    driver: bridge
